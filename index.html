    border: 2px solid rgba(255, 255, 255, 0.1);

    color: #ccc;

    padding: 6px 14px;
    border-radius: 20px;
    display: flex;
    align-items: center;
    gap: 5px;

  .tags span svg { width: 13px; height: 13px; fill: #999; }
  
  .desc {
    font-size: 14px;
    color: #aaa;
    font-family: 'Courier New', monospace;
    min-height: 22px;
    margin: 16px 0;
    letter-spacing: 0.3px;
  }
  .desc::after {
    content: '|';
    color: #666;
    animation: blink 1s infinite;
    margin-left: 2px;
  }
  @keyframes blink { 0%,50% {opacity:1} 51%,100% {opacity:0} }
  
  .country {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: #999;
    margin-bottom: 20px;
  }
  .country svg { width: 14px; height: 14px; fill: #888; }
  
  .socials {

    justify-content: center;
    gap: 12px;
    padding-top: 18px;
    border-top: 1px solid rgba(255, 255, 255, 0.07);

  .socials a {

    height: 46px;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.08);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: 0.2s;
  }
  .socials a:hover { background: rgba(255, 255, 255, 0.12); transform: translateY(-2px); }
  .socials svg { width: 22px; height: 22px; fill: #ddd; }
  
  .player {
    margin-top: 14px;
    background: rgba(20, 20, 20, 0.55);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 20px;
    padding: 16px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .player-cover {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: linear-gradient(135deg, #444, #111);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    cursor: pointer;
  }
  .player-cover svg { width: 22px; height: 22px; fill: #ddd; }
  .player-info { flex: 1; text-align: left; }
  .player-title { font-size: 14px; font-weight: 600; margin-bottom: 6px; }
  audio { width: 100%; height: 28px; filter: invert(1) hue-rotate(180deg); }

  <script>
    const text = "just a guy, tired of life";
    const el = document.getElementById('typed');
    let i = 0;
    let deleting = false;
    
    function type() {
      if (!deleting) {
        el.textContent = text.substring(0, i + 1);
        i++;
        if (i === text.length) {
          deleting = true;
          setTimeout(type, 2000);
          return;
        }
        setTimeout(type, 80);
      } else {
        el.textContent = text.substring(0, i - 1);
        i--;
        if (i === 0) {
          deleting = false;
          setTimeout(type, 500);
          return;
        }
        setTimeout(type, 40);
      }
    }
    type();
    
    const audio = document.getElementById('audio');
    const btn = document.getElementById('playBtn');
    const icon = document.getElementById('playIcon');
    let playing = false;
    
    btn.addEventListener('click', () => {
      if (playing) {
        audio.pause();
        icon.innerHTML = '<path d="M8 5v14l11-7z"/>';
      } else {
        audio.play();
        icon.innerHTML = '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';
      }
      playing = !playing;
    });
  </script>

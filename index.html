  <script>
    // Печатающийся текст
    const text = "just a guy, tired of life";
    const el = document.getElementById('typed');
    let i = 0, deleting = false;
    
    function type() {
      if (!deleting) {
        el.textContent = text.substring(0, i + 1);
        i++;
        if (i === text.length) { deleting = true; setTimeout(type, 2200); return; }
        setTimeout(type, 75);
      } else {
        el.textContent = text.substring(0, i - 1);
        i--;
        if (i === 0) { deleting = false; setTimeout(type, 600); return; }
        setTimeout(type, 35);
      }
    }
    type();
    
    // Плеер
    const audio = document.getElementById('audio');
    const btn = document.getElementById('playBtn');
    const icon = document.getElementById('playIcon');
    const bigBtn = document.getElementById('bigPlay');
    const bigIcon = document.getElementById('bigIcon');
    let playing = false;
    
    function toggle() {
      if (playing) {
        audio.pause();
        icon.innerHTML = '<path d="M8 5v14l11-7z"/>';
        bigIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
      } else {
        audio.play();
        icon.innerHTML = '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';
        bigIcon.innerHTML = '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';
      }
      playing = !playing;
    }
    btn.addEventListener('click', toggle);
    bigBtn.addEventListener('click', toggle);
  </script>
